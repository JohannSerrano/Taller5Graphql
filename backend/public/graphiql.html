<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuarios | GraphiQL</title>
    <link rel="stylesheet" href="https://esm.sh/graphiql@5.2.4/dist/style.css" />
    <style>
      body { margin: 0; }
      #graphiql { height: 100dvh; }
      .cargando { padding: 28px; font-family: Arial, sans-serif; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.8",
          "react/": "https://esm.sh/react@19.2.8/",
          "react-dom": "https://esm.sh/react-dom@19.2.8",
          "react-dom/": "https://esm.sh/react-dom@19.2.8/",
          "graphiql": "https://esm.sh/graphiql@5.2.4?standalone&external=react,react-dom,@graphiql/react,graphql",
          "graphiql/": "https://esm.sh/graphiql@5.2.4/",
          "@graphiql/react": "https://esm.sh/@graphiql/react@0.37.7?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
          "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql",
          "graphql": "https://esm.sh/graphql@17.0.2",
          "@emotion/is-prop-valid": "data:text/javascript,"
        }
      }
    </script>
  </head>
  <body>
    <div id="graphiql"><p class="cargando">Cargando GraphiQL...</p></div>
    <script type="module">
      const contenedor = document.getElementById("graphiql");
      try {
        const [React, ReactDOM, { GraphiQL }, { createGraphiQLFetcher }] = await Promise.all([
          import("react"), import("react-dom/client"), import("graphiql"), import("@graphiql/toolkit")
        ]);
        await import("graphiql/setup-workers/esm.sh");
        const consulta = `# La API anterior tiene users, name y email.
# Los alias muestran los nombres en espanol sin cambiar MySQL.
query Usuarios {
  usuarios: users {
    id
    nombre: name
    correo: email
  }
}`;
        ReactDOM.createRoot(contenedor).render(React.createElement(GraphiQL, {
          fetcher: createGraphiQLFetcher({ url: "/graphql" }),
          defaultQuery: consulta,
          defaultEditorToolsVisibility: true,
        }));
      } catch (error) {
        const aviso = document.createElement("p");
        aviso.className = "cargando";
        aviso.textContent = "No se pudo cargar GraphiQL. Comprueba tu conexion a Internet y vuelve a cargar esta pagina.";
        contenedor.replaceChildren(aviso);
        console.error(error);
      }
    </script>
  </body>
</html>
